# picom compositor: transparency + blur for i3.
# Started from the i3 config; kitty sets its own background_opacity.

backend = "glx";
vsync = true;
shadow = false;
fading = false;

blur: {
  method = "dual_kawase";
  strength = 3;
};

# Later rules override earlier ones.
rules = (
  { match = "!focused"; opacity = 0.9; },
  # kitty handles its own background_opacity; don't fade text on top of it
  { match = "class_g = 'kitty'"; opacity = 1; },
  # i3bar and rofi draw their own translucent backgrounds; keep text crisp, blur what's behind
  { match = "window_type = 'dock' || class_g = 'Rofi'"; opacity = 1; blur-background = true; },
  # keep the desktop and fullscreen windows opaque and unblurred
  { match = "window_type = 'desktop' || fullscreen"; opacity = 1; blur-background = false; },
);
