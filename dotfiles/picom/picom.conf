# picom compositor: transparency, blur and rounded corners for i3.
# Started from the i3 config; kitty sets its own background_opacity.

backend = "glx";
vsync = true;
shadow = false;
fading = false;
corner-radius = 8;

# Let fullscreen games draw straight to the screen: skips picom's extra copy and
# vsync, cutting input lag and frame-pacing stutter.
unredir-if-possible = true;

blur: {
  method = "dual_kawase";
  strength = 3;
};

# Later rules override earlier ones.
rules = (
  { match = "!focused"; opacity = 0.9; },
  # kitty handles its own background_opacity; don't fade text on top of it
  { match = "class_g = 'kitty'"; opacity = 1; },
  # i3bar and rofi draw their own translucent backgrounds; keep text crisp, blur what's behind
  { match = "window_type = 'dock' || class_g = 'Rofi'"; opacity = 1; blur-background = true; },
  # i3bar spans the screen edge; rounding it would leave notches at the corners
  { match = "window_type = 'dock'"; corner-radius = 0; },
  # keep the desktop and fullscreen windows opaque, unblurred and square
  { match = "window_type = 'desktop' || fullscreen"; opacity = 1; blur-background = false; corner-radius = 0; },
);
