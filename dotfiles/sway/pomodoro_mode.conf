# Pomodoro (uair). Reset jumps back to the first Work session (uair names
# sessions by index) and pauses it, since jumping starts the session.
# Single spaces only: sway collapses runs of spaces in the mode block name but
# not in "mode" commands, so a double space makes $mod+t point at no mode
set $mode_pomodoro Pomodoro: [space] start/pause [n]ext [p]revious [r]eset
# Also brings back the bar block, hidden after the timer sits paused a while
bindsym $mod+t exec ~/.local/bin/pomodoro-block wake, mode "$mode_pomodoro"

mode "$mode_pomodoro" {
        bindsym space exec uairctl toggle, mode "default"
        bindsym n exec uairctl next
        bindsym p exec uairctl prev
        bindsym r exec "uairctl jump 0 && uairctl pause", mode "default"

        bindsym Escape mode "default"
        bindsym Return mode "default"
        bindsym $mod+t mode "default"
}
