set $mode_media Media Mode: [Up] sound [Down] sound [t]otal [h]alf [m]uted
bindsym $mod+m mode "$mode_media"

mode "$mode_media" {
	bindsym Up exec pactl set-sink-volume 0 +5%
	bindsym Down exec pactl set-sink-volume 0 -5%
	bindsym m exec pactl set-sink-volume 0 0%
	bindsym h exec pactl set-sink-volume 0 50%
	bindsym t exec pactl set-sink-volume 0 100%

	bindsym Escape mode "default"
	bindsym Return mode "default"
}
