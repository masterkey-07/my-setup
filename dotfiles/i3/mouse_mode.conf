set $mouse_mode Mouse Mode: ([Shift]) + [Up] [Down] [Left] [Bottom] 
bindsym $mod+n mode "$mouse_mode"

mode "$mouse_mode" {
	bindsym Up exec xdotool mousemove_relative 0 -30
	bindsym Right exec xdotool mousemove_relative 30 0
	bindsym Down exec xdotool mousemove_relative 0 30
	bindsym Left exec xdotool mousemove_relative -- -30 0
	bindsym Up+Left exec xdotool mousemove_relative -- -30 -30
	bindsym Up+Right exec xdotool mousemove_relative 30 -30
    bindsym Down+Left exec xdotool mousemove_relative -- -30 30
	bindsym Down+Right exec xdotool mousemove_relative 30 30

	bindsym Shift+Up exec xdotool mousemove_relative 0 -120
	bindsym Shift+Right exec xdotool mousemove_relative 120 0
	bindsym Shift+Down exec xdotool mousemove_relative 0 120
	bindsym Shift+Left exec xdotool mousemove_relative -- -120 0
	bindsym Shift+Up+Left exec xdotool mousemove_relative -- -120 -120
	bindsym Shift+Up+Right exec xdotool mousemove_relative 120 -120
    bindsym Shift+Down+Left exec xdotool mousemove_relative -- -120 120
	bindsym Shift+Down+Right exec xdotool mousemove_relative 120 120



	bindsym Ctrl+Shift+Up exec xdotool mousemove_relative 0 -600
	bindsym Ctrl+Shift+Right exec xdotool mousemove_relative 600 0
	bindsym Ctrl+Shift+Down exec xdotool mousemove_relative 0 600
	bindsym Ctrl+Shift+Left exec xdotool mousemove_relative -- -600 0
	bindsym Ctrl+Shift+Up+Left exec xdotool mousemove_relative -- -600 -600
	bindsym Ctrl+Shift+Up+Right exec xdotool mousemove_relative 600 -600
    bindsym Ctrl+Shift+Down+Left exec xdotool mousemove_relative -- -600 600
	bindsym Ctrl+Shift+Down+Right exec xdotool mousemove_relative 600 600

	bindsym Escape mode "default"
	bindsym Return exec xdotool click 1
	bindsym Backspace exec xdotool click 2
}
